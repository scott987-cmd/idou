# i豆 control plane and document sites behind one wildcard certificate.
# The services listen on loopback only; nginx terminates TLS.
# Model answers stream (server-sent events), so nothing is buffered and
# long turns are not cut off.
#
# Installed as /etc/nginx/sites-available/idou (docs/server-deployment.md).
ssl_certificate     /etc/nginx/tls/idou.example.com.crt;
ssl_certificate_key /etc/nginx/tls/idou.example.com.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_session_cache shared:idou:10m;

# The desktops' model requests go to the model replicas (idou-api@N),
# chosen by the route code: the first 8 characters of the bearer token, the
# same for every token one person holds (src/control-plane/sessions.js). One
# person, one replica while it is up; when it is not, the next one takes them
# and reads their session from the shared database (docs/scaling-plan.md §2.3).
map $http_authorization $idou_route {
    "~^Bearer (?<code>[A-Za-z0-9_-]{8})" $code;
    default "";
}
upstream idou_model {
    hash $idou_route consistent;
    server 127.0.0.1:3043 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:3044 max_fails=1 fail_timeout=10s;
}

server {
    listen 80;
    listen [::]:80;
    server_name idou.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name idou.example.com;
    client_max_body_size 64m;
    # The coordinator keeps a model gateway of its own, for the scheduled tasks
    # that run beside it; it takes nothing from here.
    location = /v1/responses {
        proxy_pass http://idou_model;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # A replica that is stopping refuses the connection at once; the
        # request goes to the next one.
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
    }
    location / {
        proxy_pass http://127.0.0.1:3041;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# 文档网站, on the same name for now (a port of its own rather than a name).
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name idou.example.com;
    client_max_body_size 64m;
    location / {
        proxy_pass http://127.0.0.1:3042;
        proxy_http_version 1.1;
        proxy_set_header Host $host:8443;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
