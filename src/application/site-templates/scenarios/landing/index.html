<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>介绍页</title>
<link rel="stylesheet" href="site.css">
</head>
<body>
<!-- 这一页不接表格，文案就写在这里，改完刷新就能看见。
     换个样子：把 site.css 换成别的风格（简约 / 科技 / 立体）。 -->
<main class="wrap">
  <header class="head">
    <div class="head-text">
      <p class="eyebrow">你的团队</p>
    </div>
  </header>

  <section class="hero">
    <div class="hero-text">
      <h1>把每周要发的那份数，做成一个链接</h1>
      <p>不用再导出、截图、贴进群里。数在飞书表格里改，页面跟着变，同事点开就是最新的。</p>
      <a class="cta" href="#more">看看怎么做 →</a>
    </div>
    <div class="hero-figure" aria-hidden="true"><span>📈</span></div>
  </section>

  <section class="features" id="more">
    <article class="feature">
      <h3>数据还在原处</h3>
      <p>表格仍然是那张表格，谁能读它谁就能看这一页。不复制一份，也不多一套账号。</p>
    </article>
    <article class="feature">
      <h3>改表格就够了</h3>
      <p>页面按你设的间隔自己重读，看的人不用刷新，也不用被告知哪里变了。</p>
    </article>
    <article class="feature">
      <h3>发给谁你说了算</h3>
      <p>仅邀请的人、组织内有链接的人，或者跟随表格权限——和飞书文档是同一套词。</p>
    </article>
  </section>

  <footer class="foot">把这三段换成你自己的话，再把上面的大标题改掉，这一页就是你的了。</footer>
</main>
</body>
</html>
